name: QuillIOS
options:
  bundleIdPrefix: me.sma1lboy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "2G2H3TQ8J8"
  configs:
    # Sideload-only affordances (the update-manifest banner) compile into
    # Debug — which is what deploy.sh builds — and out of the Release
    # archive that goes to App Store Connect.
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SIDELOAD"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0
  # Raw llama.cpp binding (prebuilt XCFramework, zero transitive deps —
  # LocalLLMClient was rejected: its dep tree conflicts with WhisperKit's
  # swift-transformers pin on every published version).
  LlamaSwift:
    url: https://github.com/mattt/llama.swift.git
    from: 2.10184.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.0
  # Diarizer only (speaker separation); ASR stays on WhisperKit.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.7.0

targets:
  QuillIOS:
    type: application
    platform: iOS
    sources:
      - path: QuillIOS/Sources
      - path: Shared
      - path: QuillIOS/Resources/Assets.xcassets
        buildPhase: resources
      - path: QuillIOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WhisperKit
      - package: LlamaSwift
        product: LlamaSwift
      - package: MarkdownUI
        product: MarkdownUI
      - package: FluidAudio
        product: FluidAudio
      - target: QuillWidgets
        embed: true
    info:
      path: QuillIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: quill
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "18221476"
        # HTTPS-only (model downloads); no bundled crypto → exempt, so
        # App Store Connect stops asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          quill records your microphone so it can transcribe on-device.
          Audio never leaves this phone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.sma1lboy.quill
        PRODUCT_NAME: quill
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: quill App Store

  QuillWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: QuillWidgets
      - path: Shared
    info:
      path: QuillWidgets/Info.plist
      properties:
        CFBundleDisplayName: quill
        # Must match the app target's, or the build warns and an App Store
        # submission is rejected outright by ITMS validation. The plist is
        # generated from here, so keeping the two literals together is the
        # only place they can be kept in sync.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "18221476"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.sma1lboy.quill.widgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: quill widgets App Store

  QuillIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuillIOSUITests
    dependencies:
      - target: QuillIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.sma1lboy.quill.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: QuillIOS

schemes:
  QuillIOS:
    build:
      targets:
        QuillIOS: all
        QuillIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuillIOSUITests
